name: Publish LFMC preview

on:
  workflow_dispatch:
    inputs:
      pr:
        description: LFMC pull request number
        required: true
        type: string
      sha:
        description: Expected full PR head SHA
        required: true
        type: string
      version:
        description: Expected LFMC asset version
        required: true
        type: string

concurrency:
  group: lfmc-preview-pages
  cancel-in-progress: false

permissions: {}

jobs:
  stage:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: preview-snapshots
          path: history
      - name: Verify PR and package its static site
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: python3 publish.py "$PR" "$SHA" "$VERSION" history site
      - name: Preserve immutable snapshot
        run: |
          git -C history add snapshots
          if ! git -C history diff --cached --quiet; then
            git -C history -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Archive LFMC preview snapshot"
            git -C history push origin HEAD:preview-snapshots
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}latest/
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
